task: segmentation
run_root: runs
run_name: unet_resnet18_only_original_labeled_60_20_20

data:
  sources:
    - name: labeled
      root: ../data/labeled
      images: imgs
      masks: msks
      split_csv: split_mapping_60_20_20.csv
      enabled: true
      use_for:
        train: true
        val: true
        test: true

    - name: model_labeled
      root: ../data/model_labeled
      images: imgs
      masks: msks
      split_csv: image_info.csv
      enabled: false
      use_for:
        train: false
        val: false
        test: false

model:
  type: unet
  encoder: resnet18
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

training:
  epochs: 60
  batch_size: 8
  image_size: 512
  workers: 4
  seed: 42
  device: cuda:1
  augment: true
  sampler: balanced

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

loss:
  bce_weight: 1.0
  dice_weight: 2.0

validation:
  selection_metric: f1
  pipeline_every: 1
  threshold_search:
    values:
      - 0.10
      - 0.20
      - 0.30
      - 0.40
      - 0.50
      - 0.60
      - 0.70
      - 0.80
      - 0.90
      - 0.91
      - 0.92
      - 0.93
      - 0.94
      - 0.95
      - 0.96
      - 0.97
      - 0.98
      - 0.99
      - 0.995
      - 0.999

inference:
  threshold: auto
  image_size: 512
  min_area: 0
  device: null

evaluation:
  test_after_training: true
  export_errors: true
  report_per_source: true
